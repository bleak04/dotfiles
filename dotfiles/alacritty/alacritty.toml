# ==============================================================================
# ALACRITTY - bleak04
# ==============================================================================

[env]
TERM = "alacritty"

# ------------------------------------------------------------------------------
# WINDOW & PADDING
# ------------------------------------------------------------------------------
[window]
padding = { x = 16, y = 16 }
dynamic_padding = true
decorations = "none"
opacity = 1.0
blur = false

[window.class]
instance = "Alacritty"
general = "Alacritty"

# ------------------------------------------------------------------------------
# TYPOGRAPHY
# ------------------------------------------------------------------------------
[font]
size = 11.5

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.offset]
x = 0
y = 1

[font.glyph_offset]
x = 0
y = 1

# ------------------------------------------------------------------------------
# CURSOR
# ------------------------------------------------------------------------------
[cursor]
style = { shape = "Beam", blinking = "On" }
vi_mode_style = { shape = "Block", blinking = "Off" }
thickness = 0.15
blink_interval = 500

# ------------------------------------------------------------------------------
# COLOR SCHEME
# ------------------------------------------------------------------------------
[colors.primary]
background = "#0A0D14"
foreground = "#E2E8F0"
dim_foreground = "#94A3B8"

[colors.cursor]
cursor = "#3B82F6"

[colors.vi_mode_cursor]
cursor = "#60A5FA"

[colors.selection]
background = "#121723"

[colors.search.matches]
background = "#1E293B"

[colors.search.focused_match]
background = "#3B82F6"

[colors.footer_bar]
background = "#121723"
foreground = "#E2E8F0"

# Normal Colors
[colors.normal]
black   = "#0A0D14"
red     = "#EF4444"
green   = "#10B981"  # Emerald
yellow  = "#F59E0B"
blue    = "#3B82F6"  # Celestial Blue
magenta = "#8B5CF6"
cyan    = "#06B6D4"
white   = "#CBD5E1"

# Bright Colors
[colors.bright]
black   = "#1C2436"
red     = "#F87171"
green   = "#34D399"
yellow  = "#FBBF24"
blue    = "#60A5FA"  # Bright Celestial Highlight
magenta = "#A78BFA"
cyan    = "#22D3EE"
white   = "#F1F5F9"

# Dimmed Colors
[colors.dim]
black   = "#05070A"
red     = "#991B1B"
green   = "#065F46"
yellow  = "#92400E"
blue    = "#1E40AF"
magenta = "#5B21B6"
cyan    = "#155E75"
white   = "#64748B"

# ------------------------------------------------------------------------------
# BELL & MOUSE
# ------------------------------------------------------------------------------
[bell]
animation = "EaseOutExpo"
duration = 0

[mouse]
hide_when_typing = true
