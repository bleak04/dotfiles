# ==============================================================================
# ALACRITTY - TOKYO NIGHT MATTE (CAPSULE EDITION)
# ==============================================================================

[env]
TERM = "alacritty"

# ------------------------------------------------------------------------------
# WINDOW & PADDING
# ------------------------------------------------------------------------------
[window]
padding = { x = 16, y = 16 }
dynamic_padding = true
decorations = "none"
opacity = 1.0
blur = false

[window.class]
instance = "Alacritty"
general = "Alacritty"

# ------------------------------------------------------------------------------
# TYPOGRAPHY
# ------------------------------------------------------------------------------
[font]
size = 11.5

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.offset]
x = 0
y = 1

[font.glyph_offset]
x = 0
y = 1

# ------------------------------------------------------------------------------
# CURSOR
# ------------------------------------------------------------------------------
[cursor]
style = { shape = "Beam", blinking = "On" }
vi_mode_style = { shape = "Block", blinking = "Off" }
thickness = 0.15
blink_interval = 500

# ------------------------------------------------------------------------------
# TOKYO NIGHT MATTE COLOR SCHEME
# ------------------------------------------------------------------------------
[colors.primary]
background = "#16161E"
foreground = "#C0CAF5"
dim_foreground = "#A9B1D6"

[colors.cursor]
cursor = "#7AA2F7"

[colors.vi_mode_cursor]
cursor = "#BB9AF7"

[colors.selection]
background = "#292E42"

[colors.search.matches]
background = "#E0AF68"

[colors.search.focused_match]
background = "#7AA2F7"

[colors.footer_bar]
background = "#1F2335"
foreground = "#C0CAF5"

# Normal Colors (Tokyo Night Matte + Cool Teal Green Replacement)
[colors.normal]
black   = "#15161E"
red     = "#F7768E"
green   = "#4FD6BE"  # Refined Cool Teal / Emerald
yellow  = "#E0AF68"
blue    = "#7AA2F7"
magenta = "#BB9AF7"
cyan    = "#7DCFFF"
white   = "#A9B1D6"

# Bright Colors
[colors.bright]
black   = "#414868"
red     = "#F7768E"
green   = "#73DACA"  # Brighter Cool Teal Highlight
yellow  = "#E0AF68"
blue    = "#7AA2F7"
magenta = "#BB9AF7"
cyan    = "#7DCFFF"
white   = "#C0CAF5"

# Dimmed Colors
[colors.dim]
black   = "#0F0F14"
red     = "#B15465"
green   = "#399482"  # Muted Teal
yellow  = "#A07D4A"
blue    = "#5673B0"
magenta = "#856EB0"
cyan    = "#5993B5"
white   = "#787D99"

# ------------------------------------------------------------------------------
# BELL & MOUSE
# ------------------------------------------------------------------------------
[bell]
animation = "EaseOutExpo"
duration = 0

[mouse]
hide_when_typing = true
